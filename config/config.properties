# TestMu SDET-2 Framework Configuration
# Base configuration file - can be overridden by environment-specific configs

# ==================== Environment ====================
environment=staging

# ==================== Browser Settings ====================
browser=chrome
headless=false
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# ==================== Application URLs ====================
# Development
base.url.dev=https://the-internet.herokuapp.com

# Staging  
base.url.staging=https://the-internet.herokuapp.com

# Production
base.url.prod=https://the-internet.herokuapp.com

# Default base URL (fallback)
base.url=https://the-internet.herokuapp.com

# ==================== API Settings ====================
api.base.url=https://jsonplaceholder.typicode.com
api.timeout=30000

# ==================== Retry Settings ====================
retry.count=2
retry.delay.ms=1000

# ==================== Screenshot Settings ====================
screenshot.on.failure=true
screenshot.path=./screenshots

# ==================== Reporting ====================
report.path=./reports

# ==================== Logging ====================
log.level=INFO
