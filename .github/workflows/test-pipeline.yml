name: Test Automation Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

env:
  MAVEN_OPTS: -Xmx1024m

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-suite: ['smoke', 'regression']
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run ${{ matrix.test-suite }} Tests
        id: test-execution
        run: |
          mvn clean test \
            -P ${{ matrix.test-suite }},ci \
            -Denv=qa \
            -Dheadless=true \
            -DfailIfNoTests=false
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report -q
        continue-on-error: true

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.test-suite }}
          path: target/allure-results
          retention-days: 30

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.test-suite }}
          path: target/site/allure-maven-plugin
          retention-days: 30

      - name: Upload Test Logs & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.test-suite }}
          path: |
            logs/
            screenshots/
          retention-days: 30

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/target/surefire-reports/*.xml'
          check_name: Test Results - ${{ matrix.test-suite }}
          comment_mode: always

      - name: Determine Test Status
        if: always()
        id: test-status
        run: |
          if [ "${{ steps.test-execution.outcome }}" = "success" ]; then
            echo "test_passed=true" >> $GITHUB_OUTPUT
          else
            echo "test_passed=false" >> $GITHUB_OUTPUT
          fi

  publish-summary:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Create Test Summary
        run: |
          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suites Run" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Smoke Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Regression Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Available" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 Allure Test Reports" >> $GITHUB_STEP_SUMMARY
          echo "- 📸 Screenshots (for failed tests)" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 Execution Logs" >> $GITHUB_STEP_SUMMARY

      - name: Generate Email Report
        if: always()
        id: email-report
        run: |
          chmod +x ./scripts/generate-email-report.sh
          ./scripts/generate-email-report.sh
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          TEST_RESULTS_PATH: target/surefire-reports
        continue-on-error: true

      - name: Send Email with Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            🔔 Test Report - Build #${{ github.run_number }} - ${{ github.ref_name }} 
            (${{ needs.test.result == 'success' && '✅ PASSED' || '❌ FAILED' }})
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: ${{ secrets.EMAIL_FROM }}
          html_body: file://./email-report.html
        continue-on-error: true
