name: Test Automation Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

env:
  MAVEN_OPTS: -Xmx1024m

permissions:
  contents: write        # ← changed from read (needed to push gh-pages history)
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-suite: ['crossbrowser', 'api']
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run ${{ matrix.test-suite }} Tests
        id: test-execution
        run: |
          mvn clean test \
            -P ${{ matrix.test-suite }},ci \
            -Denv=qa \
            -Dheadless=true \
            -DfailIfNoTests=false
        continue-on-error: true

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.test-suite }}
          path: target/allure-results
          retention-days: 30

      - name: Upload Test Logs & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.test-suite }}
          path: |
            logs/
            screenshots/
          retention-days: 30

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/target/surefire-reports/*.xml'
          check_name: Test Results - ${{ matrix.test-suite }}
          comment_mode: always

      - name: Determine Test Status
        if: always()
        id: test-status
        run: |
          if [ "${{ steps.test-execution.outcome }}" = "success" ]; then
            echo "test_passed=true" >> $GITHUB_OUTPUT
          else
            echo "test_passed=false" >> $GITHUB_OUTPUT
          fi

  deploy-allure-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Allure Results
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate Allure Results
        run: |
          mkdir -p allure-results-consolidated
          for suite in crossbrowser api; do
            if [ -d "artifacts/allure-results-$suite" ]; then
              cp -r artifacts/allure-results-$suite/. allure-results-consolidated/ || true
            fi
          done
          echo "Consolidated results:"
          ls -la allure-results-consolidated/

      # ✅ FIX 1: Use allure CLI directly — avoids Maven report path confusion
      - name: Install Allure CLI
        run: |
          curl -o allure-2.27.0.tgz -L \
            https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.27.0/bin/allure /usr/bin/allure

      # ✅ FIX 2: Fetch existing history from gh-pages so trend graphs work
      - name: Get Allure History
        continue-on-error: true
        run: |
          git fetch origin gh-pages || true
          mkdir -p allure-results-consolidated/history
          git show origin/gh-pages:history 2>/dev/null | \
            tar x -C allure-results-consolidated/history || true

      # ✅ FIX 3: Generate report into a clean folder — index.html will be at root
      - name: Generate Allure Report
        run: |
          allure generate allure-results-consolidated \
            --clean \
            -o allure-report
          echo "--- Verifying index.html exists ---"
          ls -la allure-report/
          test -f allure-report/index.html && echo "✅ index.html found" || echo "❌ index.html MISSING"

      # ✅ FIX 4: Upload exactly the folder containing index.html
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report    # ← this folder has index.html at its root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-summary:
    runs-on: ubuntu-latest
    needs: [test, deploy-allure-report]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Test Summary
        run: |
          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "https://shivam547.github.io/testmu-sdet2-shivamanand/" >> $GITHUB_STEP_SUMMARY

      - name: Send Email with Test Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 🔔 Test Report - Build #${{ github.run_number }} - ${{ github.ref_name }} (${{ needs.test.result == 'success' && '✅ PASSED' || '❌ FAILED' }})
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Test Execution Summary
            ======================
            Build:   #${{ github.run_number }}
            Branch:  ${{ github.ref_name }}
            Commit:  ${{ github.sha }}
            Author:  ${{ github.actor }}
            Status:  ${{ needs.test.result == 'success' && '✅ PASSED' || '❌ FAILED' }}

            Allure Report:
            https://shivam547.github.io/testmu-sdet2-shivamanand/

            Actions Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true